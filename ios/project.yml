# XcodeGen spec. CI runs `xcodegen generate` to produce PostSorter.xcodeproj,
# so no .xcodeproj is checked in (and none has to be made on a Mac).
# MARKETING_VERSION is set by app-factory release; Apple picks build numbers.
name: PostSorter
options:
  bundleIdPrefix: net.leatham
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    DEVELOPMENT_TEAM: R53MF3F498
    CODE_SIGN_STYLE: Automatic
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "1.0.0"
    CURRENT_PROJECT_VERSION: "1"
    # iPhone only: a portrait-only app that also targets iPad is rejected on upload.
    TARGETED_DEVICE_FAMILY: "1"
targets:
  PostSorter:
    type: application
    platform: iOS
    sources:
      - App
    # Apple Intelligence (iOS 26+). Weak-linked so the app still launches on iOS 17-25.
    dependencies:
      - sdk: FoundationModels.framework
        weak: true
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Post Sorter
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # Opts out of iPad multitasking, so a portrait-only list is accepted.
        UIRequiresFullScreen: true
        # Standard HTTPS only: skips the per-build "Missing Compliance" question.
        ITSAppUsesNonExemptEncryption: false
        NSCameraUsageDescription: Post Sorter uses the camera to scan your letters and bills. Scans stay on this iPhone.
        NSCalendarsWriteOnlyAccessUsageDescription: Post Sorter adds an event on a letter's due date when you ask it to. It never reads your calendar.
        NSFaceIDUsageDescription: Post Sorter can use Face ID to keep your post private.
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.leatham.postsorter
        # Repeats the project-level "1": XcodeGen's iOS preset sets "1,2" at
        # target level, which overrides the project setting and makes a
        # portrait-only universal build that App Store Connect rejects (90474).
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO
