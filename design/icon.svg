<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0.35" y2="1">
      <stop offset="0" stop-color="#FF9A5A"/>
      <stop offset="1" stop-color="#E8432A"/>
    </linearGradient>
    <linearGradient id="pocket" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFF7F2"/>
      <stop offset="1" stop-color="#FFE4D4"/>
    </linearGradient>
    <filter id="drop" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="22" flood-color="#7A1C0C" flood-opacity="0.35"/>
    </filter>
    <filter id="lift" x="-10%" y="-30%" width="120%" height="160%">
      <feDropShadow dx="0" dy="-6" stdDeviation="10" flood-color="#9A3A1E" flood-opacity="0.22"/>
    </filter>
  </defs>
  <rect width="1024" height="1024" fill="url(#bg)"/>
  <g filter="url(#drop)">
    <!-- envelope back -->
    <rect x="202" y="420" width="620" height="410" rx="56" fill="#FFCDB4"/>
    <!-- letter -->
    <rect x="282" y="214" width="460" height="560" rx="40" fill="#FFFFFF"/>
    <path d="M396 432 L478 514 L632 360" fill="none" stroke="#E8432A" stroke-width="64" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- envelope front pocket -->
    <path filter="url(#lift)" d="M202 560 L512 738 L822 560 V774 a56 56 0 0 1 -56 56 H258 a56 56 0 0 1 -56 -56 Z" fill="url(#pocket)"/>
  </g>
</svg>
